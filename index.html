<!doctype html>
<html lang="fr" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Joowifi - Cloud MikroTik Hotspot & POS</title>
    <meta name="description" content="Plateforme SaaS et PWA de gestion cloud de hotspots WiFi MikroTik, émission de tickets, caisse POS mobile et comptabilité pour opérateurs en Afrique de l'Ouest." />
    <meta property="og:title" content="Joowifi - Cloud MikroTik Hotspot & POS" />
    <meta property="og:description" content="Pilotez vos hotspots MikroTik depuis le cloud, gérez vos vendeurs POS et suivez vos revenus sans ouvrir aucun port (Zero-Trust & CGNAT)." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#005A5B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Joowifi" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var SW_VERSION = 'joowifi_sw_v11_login_fixed';
          if (localStorage.getItem('joowifi_zero_mock_v11') !== '1') {
            localStorage.clear();
            localStorage.setItem('joowifi_zero_mock_v11', '1');
          }
          if (localStorage.getItem(SW_VERSION) !== '1') {
            localStorage.setItem(SW_VERSION, '1');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                Promise.all(keys.map(function (k) { return caches.delete(k); })).then(function () {
                  window.location.reload();
                });
              });
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full bg-[#F4F7FA] text-[#1E293B] antialiased selection:bg-[#008060] selection:text-white font-sans">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
